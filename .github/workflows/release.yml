name: auto-release

# 监听 main 上的 push：manifest.json 版本号变化时自动打 v<version> tag，
# 连锁触发 build.yml（tag → 出包 + Release）。
# 防呆：tag 已存在则跳过；版本号回退（旧 → 新变小）直接报错拦截；首次推送/异常事件不动作。
# 注意：workflow 只在事件发生分支上读取，本文件随 dev 合入 main 后才生效。

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag-on-version-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要用 push 前的 commit（github.event.before）对比旧版本号

      - name: Compare manifest version
        id: ver
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          NEW=$(jq -r '.version' manifest.json)
          OLD=$(git show "$BEFORE:manifest.json" 2>/dev/null | jq -r '.version' || true)
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"

      - name: Tag if version bumped
        if: steps.ver.outputs.new != steps.ver.outputs.old
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.ver.outputs.new }}
          OLD: ${{ steps.ver.outputs.old }}
        run: |
          if [ -z "$OLD" ]; then
            echo "manifest 首次出现在 main，保守起见不自动打 tag"
            exit 0
          fi
          # 对比基准 = 远端最新 v* tag（真正的发版事实源）。
          # 不用 main 上一版 manifest：它可能过期（如初始 1.0.0 高于实际发布的 0.0.1）。
          MAX_TAG=$(git ls-remote --tags origin 'refs/tags/v*' \
            | sed 's|.*refs/tags/v||' | grep -v '\^{}' | sort -V | tail -1)
          if [ -z "$MAX_TAG" ]; then
            echo "远端还没有任何 v* tag，保守起见不自动打 tag"
            exit 0
          fi
          if [ "$NEW" = "$MAX_TAG" ]; then
            echo "v$NEW 已发布过（与最新 tag 一致），跳过"
            exit 0
          fi
          LOWEST=$(printf '%s\n%s\n' "$MAX_TAG" "$NEW" | sort -V | head -1)
          if [ "$LOWEST" != "$NEW" ]; then
            echo "::error::版本号 $NEW 低于已发布的 v$MAX_TAG，拒绝自动发版"
            exit 1
          fi
          git tag "v$NEW"
          git push origin "v$NEW"
