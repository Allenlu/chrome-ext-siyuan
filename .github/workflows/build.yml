name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # 打 tag 时创建 Release 需要

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: meta
        run: echo "version=$(jq -r '.version' manifest.json)" >> "$GITHUB_OUTPUT"

      # 打包逻辑唯一来源是 package.sh，避免脚本与 CI 两处漂移
      - name: Package
        run: bash package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-ext-siyuan-v${{ steps.meta.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

      # 仅打 v* tag 时发布 Release；已存在则清空旧 asset 后重传（版本改名不残留旧包）
      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' \
            | xargs -r -n1 gh release delete-asset "$GITHUB_REF_NAME" --yes
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
