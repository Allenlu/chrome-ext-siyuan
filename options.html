<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <title>思源划词收藏 · 设置</title>
    <style>
        body {
            width: 380px;
            margin: 0;
            padding: 16px;
            font: 13px/1.6 system-ui, sans-serif;
            color: #333;
            box-sizing: border-box;
        }

        h1 {
            font-size: 15px;
            margin: 0 0 12px;
        }

        .send {
            width: 100%;
            padding: 9px 0;
            border: 0;
            border-radius: 8px;
            background: #4285f4;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 14px;
        }

        .send:hover {
            background: #3b78e7;
        }

        label {
            display: block;
            margin-bottom: 10px;
        }

        input,
        select {
            box-sizing: border-box;
            width: 100%;
            margin-top: 4px;
            padding: 7px 9px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .row {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 4px;
        }

        button {
            padding: 7px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #f5f5f5;
            cursor: pointer;
        }

        button.primary {
            border: 0;
            background: #4285f4;
            color: #fff;
        }

        #status {
            min-height: 18px;
            margin-top: 10px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>

<body>
    <h1>思源划词收藏</h1>
    <button id="send-article" class="send">📄 发送整页到思源</button>
    <label>服务地址<input id="server" placeholder="http://127.0.0.1:6806"></label>
    <label>API token<input id="token" type="password" placeholder="思源 设置→关于 里复制"></label>
    <label>笔记本<select id="notebook">
            <option value="">— 先加载笔记本 —</option>
        </select></label>
    <div class="row">
        <button id="load">加载笔记本</button>
        <button id="save" class="primary">保存</button>
    </div>
    <div id="status"></div>
    <script src="options.js"></script>
</body>

</html>
